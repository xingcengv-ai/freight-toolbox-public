[package]
name = "freight-rate-tool"
version = "0.1.1"
description = "海运报价查询系统"
authors = ["Freight Toolbox"]
edition = "2021"

[lib]
name = "freight_rate_tool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
